name: citra-build

on:
  push:
    branches: [ "AzaharTrigger" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "*" ]

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Pack
        run: ./.ci/source.sh
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: source
          path: artifacts/

  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ["appimage", "appimage-wayland", "fresh"]
    container:
      image: opensauce04/azahar-build-environment:latest
      options: -u 1001
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPILERCHECK: content
      CCACHE_SLOPPINESS: time_macros
      OS: linux
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up cache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-${{ matrix.target }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-
      - name: Set tag for build
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
              echo "$GITHUB_REF_NAME" > GIT-TAG
          elif [ -f GIT-TAG ]; then
              echo "Using existing GIT-TAG file"
          else
              echo "dev" > GIT-TAG
          fi
      - name: Build
        run: ./.ci/linux.sh
      - name: Move AppImage to artifacts directory
        if: ${{ contains(matrix.target, 'appimage') }}
        run: |
          mkdir -p artifacts
          mv build/bundle/*.AppImage artifacts/
      - name: Rename AppImage
        if: ${{ matrix.target == 'appimage-wayland' }}
        run: |
          mv artifacts/azahar.AppImage artifacts/azahar-wayland.AppImage
      - name: Upload
        if: ${{ contains(matrix.target, 'appimage') }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.OS }}-${{ env.TARGET }}
          path: artifacts/

  macos:
    runs-on: ${{ (matrix.target == 'x86_64' && 'macos-15-intel') || 'macos-26' }}
    strategy:
      fail-fast: false
      matrix:
        target: ["x86_64", "arm64"]
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPILERCHECK: content
      CCACHE_SLOPPINESS: time_macros
      OS: macos
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up cache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-${{ matrix.target }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-
      - name: Set tag for build
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
              echo "$GITHUB_REF_NAME" > GIT-TAG
          elif [ -f GIT-TAG ]; then
              echo "Using existing GIT-TAG file"
          else
              echo "dev" > GIT-TAG
          fi
      - name: Install tools
        run: brew install ccache ninja spirv-tools
      - name: Build
        run: ./.ci/macos.sh
      - name: Prepare outputs for caching
        run: cp -R build/bundle $OS-$TARGET
      - name: Cache outputs for universal build
        uses: actions/cache/save@v4
        with:
          path: ${{ env.OS }}-${{ env.TARGET }}
          key: ${{ runner.os }}-${{ matrix.target }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Pack
        run: ./.ci/pack.sh
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.OS }}-${{ env.TARGET }}
          path: artifacts/

  macos-universal:
    runs-on: macos-26
    needs: macos
    env:
      OS: macos
      TARGET: universal
    steps:
      - uses: actions/checkout@v4
      - name: Download x86_64 build from cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.OS }}-x86_64
          key: ${{ runner.os }}-x86_64-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          fail-on-cache-miss: true
      - name: Download ARM64 build from cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.OS }}-arm64
          key: ${{ runner.os }}-arm64-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          fail-on-cache-miss: true
      - name: Create universal app
        run: ./.ci/macos-universal.sh
        env:
          ARTIFACTS: ${{ env.OS }}-x86_64 ${{ env.OS }}-arm64
      - name: Pack
        run: ./.ci/pack.sh
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.OS }}-${{ env.TARGET }}
          path: artifacts/

  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        target: ["msvc", "msys2"]
    defaults:
      run:
        shell: ${{ (matrix.target == 'msys2' && 'msys2') || 'bash' }} {0}
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPILERCHECK: content
      CCACHE_SLOPPINESS: time_macros
      OS: windows
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up cache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-${{ matrix.target }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-
      - name: Set tag for build
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
              echo "$GITHUB_REF_NAME" > GIT-TAG
          elif [ -f GIT-TAG ]; then
              echo "Using existing GIT-TAG file"
          else
              echo "dev" > GIT-TAG
          fi
        shell: bash
      - name: Set up MSVC
        if: ${{ matrix.target == 'msvc' }}
        uses: ilammy/msvc-dev-cmd@v1
      - name: Install extra tools (MSVC)
        if: ${{ matrix.target == 'msvc' }}
        run: choco install ccache ninja ptime wget
      - name: Install vulkan-sdk (MSVC)
        if: ${{ matrix.target == 'msvc' }}
        run: |
          wget https://sdk.lunarg.com/sdk/download/1.4.304.1/windows/VulkanSDK-1.4.304.1-Installer.exe -O D:/a/_temp/vulkan.exe
          D:/a/_temp/vulkan.exe --accept-licenses --default-answer --confirm-command install
      - name: Set up MSYS2
        if: ${{ matrix.target == 'msys2' }}
        uses: msys2/setup-msys2@v2
        with:
          msystem: clang64
          update: true
          install: git make p7zip
          pacboy: >-
            toolchain:p ccache:p cmake:p ninja:p spirv-tools:p
            qt6-base:p qt6-multimedia:p qt6-multimedia-wmf:p qt6-tools:p qt6-translations:p
      - name: Install extra tools (MSYS2)
        if: ${{ matrix.target == 'msys2' }}
        uses: crazy-max/ghaction-chocolatey@v3
        with:
          args: install ptime wget
      - name: Install NSIS
        if: ${{ github.ref_type == 'tag' }}
        run: |
          wget https://download.sourceforge.net/project/nsis/NSIS%203/3.11/nsis-3.11-setup.exe -O D:/a/_temp/nsis-setup.exe
          ptime D:/a/_temp/nsis-setup.exe /S
        shell: pwsh
      - name: Disable line ending translation
        run: git config --global core.autocrlf input
      - name: Build
        run: ./.ci/windows.sh
      - name: Generate installer
        if: ${{ github.ref_type == 'tag' }}
        run: |
          cd src\installer
          "C:\Program Files (x86)\NSIS\makensis.exe" /DPRODUCT_VARIANT=${{ matrix.target }} /DPRODUCT_VERSION=${{ github.ref_name }} citra.nsi
          mkdir ..\..\artifacts 2> NUL
          move /y *.exe ..\..\artifacts\
        shell: cmd
      - name: Pack
        run: ./.ci/pack.sh
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.OS }}-${{ env.TARGET }}
          path: artifacts/

  android:
    runs-on: ubuntu-latest
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPILERCHECK: content
      CCACHE_SLOPPINESS: time_macros
      OS: android
      TARGET: universal
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-android-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-android-
      - name: Set tag for build
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
              echo "$GITHUB_REF_NAME" > GIT-TAG
          elif [ -f GIT-TAG ]; then
              echo "Using existing GIT-TAG file"
          else
              echo "dev" > GIT-TAG
          fi
      - name: Deps
        run: |
          sudo apt-get update -y
          sudo apt-get install ccache apksigner -y
      - name: Update Android SDK CMake and NDK version
        run: |
          echo "y" | ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager "ndk;27.1.12297006"
          echo "y" | ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager "cmake;3.30.3"
      - name: Build
        run: JAVA_HOME=$JAVA_HOME_17_X64 ./.ci/android.sh
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
      - name: Pack
        run: ../../../.ci/pack.sh
        working-directory: src/android/app
        env:
          UNPACKED: 1
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.OS }}-${{ env.TARGET }}
          path: src/android/app/artifacts/

  docker:
    runs-on: ubuntu-latest
    container:
      image: docker:dind
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set tag for build
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
              echo "$GITHUB_REF_NAME" > GIT-TAG
          elif [ -f GIT-TAG ]; then
              echo "Using existing GIT-TAG file"
          else
              echo "dev" > GIT-TAG
          fi
      - name: Build Docker image
        run: ./.ci/docker.sh
      - name: Move Docker image to artifacts directory
        run: |
          mkdir -p artifacts
          mv build/*.dockerimage artifacts/
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: docker
          path: artifacts/

  release:
    runs-on: ubuntu-latest
    needs: [source, linux, macos-universal, windows, android, docker]
    if: github.event_name == 'push' && github.ref_name == 'AzaharTrigger'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          
      - name: Download libretro artifacts
        uses: actions/download-artifact@v4
        with:
          workflow: libretro.yml
          path: libretro-artifacts
          
      - name: Generate changelog
        id: changelog
        run: |
          CHANGELOG=$(git log -15 --pretty=format:"- %s (%h)")
          
          echo "$CHANGELOG" > changelog.txt
          echo "CHANGELOG<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          
          echo "Changelog generated for branch push:"
          cat changelog.txt
          
      - name: Determine Tag and Release Name
        run: |
          git fetch --tags --force
          
          # First check if GIT-TAG file exists and use it
          if [ -f GIT-TAG ]; then
            TAG_VERSION=$(cat GIT-TAG | tr -d '\n\r')
            # Add 'v' prefix if not present
            if [[ ! $TAG_VERSION =~ ^v ]]; then
              TAG_VERSION="v${TAG_VERSION}"
            fi
            NEW_VERSION="$TAG_VERSION"
            echo "Using version from GIT-TAG file: $NEW_VERSION"
          else
            # Fall back to auto-generation from git tags
            LATEST_TAG=$(git tag -l "v[0-9]*.[0-9]*.[0-9]*" | sort -V | tail -n 1)
            
            if [ -z "$LATEST_TAG" ]; then
              NEW_VERSION="v1.0.4"
            else
              if [[ $LATEST_TAG =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
                MAJOR="${BASH_REMATCH[1]}"
                MINOR="${BASH_REMATCH[2]}"
                PATCH="${BASH_REMATCH[3]}"
                NEW_PATCH=$((PATCH + 1))
                NEW_VERSION="v${MAJOR}.${MINOR}.${NEW_PATCH}"
              else
                NEW_VERSION="v1.0.4"
              fi
            fi
            echo "Auto-generated version: $NEW_VERSION"
          fi
          
          COMMIT_MSG=$(git log -1 --pretty=format:"%s")
          
          echo "TAG_NAME=$NEW_VERSION" >> $GITHUB_ENV
          echo "RELEASE_NAME=$NEW_VERSION - $COMMIT_MSG" >> $GITHUB_ENV

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: ${{ env.RELEASE_NAME }}
          body: ${{ steps.changelog.outputs.CHANGELOG }}
          files: |
            artifacts/source/*
            artifacts/linux-appimage/*
            artifacts/linux-appimage-wayland/*
            artifacts/macos-universal/*
            artifacts/windows-msvc/*
            artifacts/windows-msys2/*
            artifacts/android-universal/*
            artifacts/docker/*
            libretro-artifacts/android-arm64-v8a/*
            libretro-artifacts/linux-x86_64/*
            libretro-artifacts/windows-x86_64/*
            libretro-artifacts/macos-x86_64/*
            libretro-artifacts/macos-arm64/*
            libretro-artifacts/ios-arm64/*
            libretro-artifacts/tvos-arm64/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.TRIGGER_TOKEN_REPO }}