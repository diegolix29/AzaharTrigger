name: citra-build

on:
  push:
    branches: [ "AzaharTrigger" ]
    # Releases are cut ONLY by pushing a version tag, e.g.:
    #   git tag v1.0.15 && git push origin v1.0.15
    # The tag is baked into every binary (desktop BUILD_VERSION / Android versionName) and is
    # what the in-app updaters compare against, so binaries and release always agree.
    tags: [ "v[0-9]+.[0-9]+.[0-9]+*" ]
  pull_request:
    branches: [ "*" ]

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Pack
        run: ./.ci/source.sh
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: source
          path: artifacts/

  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ["appimage", "appimage-wayland", "fresh"]
    container:
      image: opensauce04/azahar-build-environment:latest
      options: -u 1001
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPILERCHECK: content
      CCACHE_SLOPPINESS: time_macros
      OS: linux
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up cache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-${{ matrix.target }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-
      - name: Set tag for build
        run: |
          # Only tagged builds get a version; anything else is an unversioned dev build.
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
              echo "$GITHUB_REF_NAME" > GIT-TAG
          else
              rm -f GIT-TAG
          fi
      - name: Build
        run: ./.ci/linux.sh
      - name: Move AppImage to artifacts directory
        if: ${{ contains(matrix.target, 'appimage') }}
        run: |
          mkdir -p artifacts
          mv build/bundle/*.AppImage artifacts/
      - name: Rename AppImage
        if: ${{ contains(matrix.target, 'appimage') }}
        run: |
          # Name the AppImage after the target (and the tag on releases) so the
          # in-app updater picks the asset built for this exact release.
          NAME="azahar"
          if [[ "$TARGET" == "appimage-wayland" ]]; then NAME="azahar-wayland"; fi
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then NAME="$NAME-$GITHUB_REF_NAME"; fi
          if [[ "artifacts/azahar.AppImage" != "artifacts/$NAME.AppImage" ]]; then
              mv artifacts/azahar.AppImage "artifacts/$NAME.AppImage"
          fi
      - name: Upload
        if: ${{ contains(matrix.target, 'appimage') }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.OS }}-${{ env.TARGET }}
          path: artifacts/

  macos:
    runs-on: ${{ (matrix.target == 'x86_64' && 'macos-15-intel') || 'macos-26' }}
    strategy:
      fail-fast: false
      matrix:
        target: ["x86_64", "arm64"]
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPILERCHECK: content
      CCACHE_SLOPPINESS: time_macros
      OS: macos
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up cache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-${{ matrix.target }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-
      - name: Set tag for build
        run: |
          # Only tagged builds get a version; anything else is an unversioned dev build.
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
              echo "$GITHUB_REF_NAME" > GIT-TAG
          else
              rm -f GIT-TAG
          fi
      - name: Install tools
        run: brew install ccache ninja spirv-tools
      # FFmpeg is now linked directly into Azahar, so it has to be provided at build time.
      # Each runner builds natively for its own arch (same Conan recipe upstream uses).
      - name: Install Conan
        uses: conan-io/setup-conan@v1
      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2/p
          key: conan-ffmpeg-7.1.5-${{ runner.os }}-${{ matrix.target }}
      - name: Build FFmpeg
        run: |
          # x86_64 runners ship NASM 2.15. x264's assembler probe needs a newer
          # nasm and exits even though it prints 2.15 as acceptable. Build that
          # dependency without hand-written assembly.
          if [[ "$TARGET" == "x86_64" ]]; then
              x264_asm=(-o "libx264/*:with_asm=False")
          else
              x264_asm=()
          fi
          conan install \
               --output-folder=$HOME/conan \
               --generator=CMakeToolchain \
               --build=missing \
               -s os.version=13.4 \
               -o "*:shared=True" \
               -o "*:with_libfdk_aac=False" \
               ${x264_asm+"${x264_asm[@]}"} \
               --requires=ffmpeg/7.1.5 \
               -c "ffmpeg/*:tools.build:sharedlinkflags+=['-Wl,-flat_namespace']" \
               -c "ffmpeg/*:tools.build:exelinkflags+=['-Wl,-flat_namespace']"
      - name: Build
        run: ./.ci/macos.sh
      - name: Prepare outputs for caching
        run: cp -R build/bundle $OS-$TARGET
      - name: Cache outputs for universal build
        uses: actions/cache/save@v4
        with:
          path: ${{ env.OS }}-${{ env.TARGET }}
          key: ${{ runner.os }}-${{ matrix.target }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Pack
        run: ./.ci/pack.sh
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.OS }}-${{ env.TARGET }}
          path: artifacts/

  macos-universal:
    runs-on: macos-26
    needs: macos
    env:
      OS: macos
      TARGET: universal
    steps:
      - uses: actions/checkout@v4
      - name: Download x86_64 build from cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.OS }}-x86_64
          key: ${{ runner.os }}-x86_64-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          fail-on-cache-miss: true
      - name: Download ARM64 build from cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.OS }}-arm64
          key: ${{ runner.os }}-arm64-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          fail-on-cache-miss: true
      - name: Create universal app
        run: ./.ci/macos-universal.sh
        env:
          ARTIFACTS: ${{ env.OS }}-x86_64 ${{ env.OS }}-arm64
      - name: Pack
        run: ./.ci/pack.sh
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.OS }}-${{ env.TARGET }}
          path: artifacts/

  windows:
    strategy:
      fail-fast: false
      matrix:
        include:
        - target: msvc
          os: windows-latest
        # Upstream replaced the MSYS2 build (and .ci/windows.sh) with an MXE cross-build.
        - target: mxe
          os: ubuntu-latest
          container:
            image: opensauce04/azahar-build-environment:latest
            options: -u 1001
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    defaults:
      run:
        shell: bash
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPILERCHECK: content
      CCACHE_SLOPPINESS: time_macros
      OS: windows
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up cache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-${{ matrix.target }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-
      - name: Set tag for build
        run: |
          # Only tagged builds get a version; anything else is an unversioned dev build.
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
              echo "$GITHUB_REF_NAME" > GIT-TAG
          else
              rm -f GIT-TAG
          fi
      - name: Set up MSVC
        if: ${{ matrix.target == 'msvc' }}
        uses: ilammy/msvc-dev-cmd@v1
      - name: Install extra tools (MSVC)
        if: ${{ matrix.target == 'msvc' }}
        run: choco install ccache ninja ptime wget
      # FFmpeg is now linked directly into Azahar, so it has to be provided at build time.
      - name: Checkout vcpkg for FFmpeg 7.1.2 (MSVC)
        if: ${{ matrix.target == 'msvc' }}
        shell: pwsh
        run: |
          cd C:\vcpkg
          git fetch --quiet origin 5087d22fd76fe1844ca492866055dea3c34e7f52
          git checkout 5087d22fd76fe1844ca492866055dea3c34e7f52
          .\bootstrap-vcpkg.bat -disableMetrics
      - name: Cache vcpkg binaries (MSVC)
        if: ${{ matrix.target == 'msvc' }}
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/vcpkg/archives
          key: vcpkg-ffmpeg-7.1.2-5087d22f
      - name: Build FFmpeg (MSVC)
        if: ${{ matrix.target == 'msvc' }}
        run: vcpkg install
          ffmpeg[avcodec,avfilter,avformat,swresample,aom,dav1d,mp3lame,opus,snappy,soxr,theora,vorbis,vpx,vulkan,x264,x265]:x64-windows-release
      - name: Install vulkan-sdk (MSVC)
        if: ${{ matrix.target == 'msvc' }}
        run: |
          wget https://sdk.lunarg.com/sdk/download/1.4.304.1/windows/VulkanSDK-1.4.304.1-Installer.exe -O D:/a/_temp/vulkan.exe
          D:/a/_temp/vulkan.exe --accept-licenses --default-answer --confirm-command install
      - name: Install NSIS (MSVC)
        if: ${{ github.ref_type == 'tag' && matrix.target == 'msvc' }}
        run: |
          wget https://download.sourceforge.net/project/nsis/NSIS%203/3.11/nsis-3.11-setup.exe -O D:/a/_temp/nsis-setup.exe
          ptime D:/a/_temp/nsis-setup.exe /S
        shell: pwsh
      - name: Disable line ending translation
        run: git config --global core.autocrlf input
      - name: Build (MSVC)
        if: ${{ matrix.target == 'msvc' }}
        run: ./.ci/win-msvc.sh
      - name: Build (MXE)
        if: ${{ matrix.target == 'mxe' }}
        run: ./.ci/win-mxe.sh
      - name: Generate installer (MSVC)
        if: ${{ github.ref_type == 'tag' && matrix.target == 'msvc' }}
        run: |
          cd src\installer
          "C:\Program Files (x86)\NSIS\makensis.exe" /DPRODUCT_VARIANT=${{ matrix.target }} /DPRODUCT_VERSION=${{ github.ref_name }} citra.nsi
          mkdir ..\..\artifacts 2> NUL
          move /y *.exe ..\..\artifacts\
        shell: cmd
      - name: Generate installer (MXE)
        if: ${{ github.ref_type == 'tag' && matrix.target == 'mxe' }}
        run: |
          export PATH="/opt/mxe/usr/bin:${PATH}"
          cd src/installer
          x86_64-w64-mingw32.shared-makensis -DPRODUCT_VARIANT=${{ matrix.target }} -DPRODUCT_VERSION=${{ github.ref_name }} citra.nsi
          mkdir -p ../../artifacts
          mv ./*.exe ../../artifacts/
      - name: Pack
        run: ./.ci/pack.sh
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.OS }}-${{ env.TARGET }}
          path: artifacts/

  android:
    runs-on: ubuntu-latest
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPILERCHECK: content
      CCACHE_SLOPPINESS: time_macros
      OS: android
      TARGET: universal
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-android-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-android-
      - name: Set tag for build
        run: |
          # Only tagged builds get a version; anything else is an unversioned dev build.
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
              echo "$GITHUB_REF_NAME" > GIT-TAG
          else
              rm -f GIT-TAG
          fi
      - name: Deps
        run: |
          sudo apt-get update -y
          sudo apt-get install ccache apksigner -y
      - name: Update Android SDK CMake and NDK version
        run: |
          echo "y" | ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager "ndk;27.1.12297006"
          echo "y" | ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager "cmake;3.30.3"
      - name: Build
        run: JAVA_HOME=$JAVA_HOME_17_X64 ./.ci/android.sh
        env:
          GIT_TAG_NAME: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
      - name: Pack
        run: ../../../.ci/pack.sh
        working-directory: src/android/app
        env:
          UNPACKED: 1
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.OS }}-${{ env.TARGET }}
          path: src/android/app/artifacts/

  docker:
    runs-on: ubuntu-latest
    container:
      image: docker:dind
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set tag for build
        run: |
          # Only tagged builds get a version; anything else is an unversioned dev build.
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
              echo "$GITHUB_REF_NAME" > GIT-TAG
          else
              rm -f GIT-TAG
          fi
      - name: Build Docker image
        run: ./.ci/docker.sh
      - name: Move Docker image to artifacts directory
        run: |
          mkdir -p artifacts
          mv build/*.dockerimage artifacts/
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: docker
          path: artifacts/

  release:
    runs-on: ubuntu-latest
    needs: [source, linux, macos-universal, windows, android, docker]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          
      - name: Download libretro artifacts
        uses: actions/download-artifact@v4
        with:
          workflow: libretro.yml
          path: libretro-artifacts
          
      - name: Generate changelog
        id: changelog
        run: |
          CHANGELOG=$(git log -15 --pretty=format:"- %s (%h)")
          
          echo "$CHANGELOG" > changelog.txt
          echo "CHANGELOG<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          
          echo "Changelog generated for branch push:"
          cat changelog.txt
          
      - name: Determine Tag and Release Name
        run: |
          NEW_VERSION="$GITHUB_REF_NAME"
          # The updaters parse the tag as a version, so refuse anything that isn't vX.Y.Z[-suffix]
          # (e.g. tags made from commit messages).
          if [[ ! "$NEW_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
              echo "::error::Tag '$NEW_VERSION' is not a version tag like v1.2.3 or v1.2.3-rc1"
              exit 1
          fi
          # A suffix (v1.2.3-rc1) marks a prerelease, which stable-channel users won't be offered.
          if [[ "$NEW_VERSION" == *-* ]]; then PRERELEASE=true; else PRERELEASE=false; fi
          COMMIT_MSG=$(git log -1 --pretty=format:"%s")

          echo "TAG_NAME=$NEW_VERSION" >> $GITHUB_ENV
          echo "RELEASE_NAME=$NEW_VERSION - $COMMIT_MSG" >> $GITHUB_ENV
          echo "PRERELEASE=$PRERELEASE" >> $GITHUB_ENV

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: ${{ env.RELEASE_NAME }}
          body: ${{ steps.changelog.outputs.CHANGELOG }}
          files: |
            artifacts/source/*
            artifacts/linux-appimage/*
            artifacts/linux-appimage-wayland/*
            artifacts/macos-universal/*
            artifacts/windows-msvc/*
            artifacts/windows-mxe/*
            artifacts/android-universal/*
            artifacts/docker/*
            libretro-artifacts/android-arm64-v8a/*
            libretro-artifacts/linux-x86_64/*
            libretro-artifacts/windows-x86_64/*
            libretro-artifacts/macos-x86_64/*
            libretro-artifacts/macos-arm64/*
            libretro-artifacts/ios-arm64/*
            libretro-artifacts/tvos-arm64/*
          draft: false
          prerelease: ${{ env.PRERELEASE == 'true' }}
          make_latest: ${{ env.PRERELEASE != 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.TRIGGER_TOKEN_REPO }}